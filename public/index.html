        <button class="sg-btn" type="button" onclick="event.stopPropagation();openSubmit()"><span data-t="sub_card_btn"></span><svg class="icon" viewBox="0 0 24 24"><use href="#i-arrow"/></svg></button>
      </div>

      <div class="footer">
        <button class="footlink" onclick="go('faq')" data-t="faq_footer"></button>
        <button class="footlink" onclick="openSubmit()" data-t="sub_footer"></button>
        <span>©2026 제주 축제 도장 · All rights reserved</span>
      </div>
    </section>

    <!-- ===== MAP ===== -->
    <section id="v-map" class="view">
      <header class="map-hero">
        <span class="map-ey" data-t="map_eyebrow"></span>
        <h1 class="map-t" data-t="map_title"></h1>
        <p class="map-s" data-t="map_sub"></p>
      </header>
      <div class="maplayout">
        <div class="mapframe">
          <div id="map"></div>
          <div class="mapbadge" id="mapBadge"></div>
          <div class="maplegend" id="mapLegend"></div>
        </div>
        <div class="mapside">
          <div class="tracker">
            <div class="tk-guilloche" aria-hidden="true"></div>
            <div class="tk-head">
              <span class="tk-eyebrow">🗺 <span data-t="map_slots"></span></span>
              <p data-t="slot_hint"></p>
            </div>
            <div class="tk-ringrow">
              <div class="tk-ring">
                <svg viewBox="0 0 90 90"><circle class="bg" cx="45" cy="45" r="39"/><circle class="fg" id="mapRing" cx="45" cy="45" r="39"/></svg>
                <div class="tk-ring-txt"><b id="mapCount">0</b><span>/5</span></div>
              </div>
              <div class="tk-side">
                <div class="slots" id="mapSlots"></div>
                <div class="tk-pct" id="mapPct"></div>
              </div>
            </div>
          </div>
          <div class="maplist-wrap">
            <div class="ml-head"><span data-t="map_list_head"></span><span class="ml-count" id="mapListCount"></span></div>
            <div class="maplist" id="mapList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== SEARCH ===== -->
    <section id="v-search" class="view">
      <header class="srch-hero">
        <span class="srch-ey" data-t="search_eyebrow"></span>
        <h1 class="srch-t" data-t="search_title2"></h1>
        <p class="srch-s" data-t="search_sub"></p>
      </header>
      <div class="srch-bar">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <input id="searchInput" autocomplete="off" spellcheck="false" oninput="renderSearch()" onkeydown="if(event.key==='Escape')clearSearch()">
        <button type="button" id="searchClear" class="srch-clear" onclick="clearSearch()" aria-label="clear" hidden>✕</button>
      </div>
      <div class="srch-filters">
        <div id="searchFilters" class="srch-chips"></div>
        <div class="selectw srch-sort">
          <select id="searchSort" onchange="renderSearch()"></select>
          <svg class="icon cc" viewBox="0 0 24 24"><use href="#i-caret"/></svg>
        </div>
      </div>
      <div class="srch-resulthead">
        <span id="searchCount"></span>
        <button type="button" id="searchReset" class="srch-reset" onclick="resetSearch()" hidden><span data-t="search_reset"></span></button>
      </div>
      <div class="srch-list" id="searchList"></div>
    </section>

    <!-- ===== MY ===== -->
    <section id="v-my" class="view">
      <div class="sec-head"><h2 data-t="my_title"></h2></div>
      <div id="myBody"></div>
    </section>

    <!-- ===== REWARDS + ACHIEVEMENTS ===== -->
    <section id="v-rewards" class="view">
      <div id="rewardsBody"></div>
    </section>

    <!-- ===== RANK ===== -->
    <section id="v-rank" class="view">
      <div class="sec-head"><h2 data-t="rank_title"></h2><p data-t="rank_sub"></p></div>
      <div class="rankcd" id="rankCd" hidden></div>
      <div id="rankList"></div>
    </section>

    <!-- ===== FAQ ===== -->
    <!-- ===== FAQ ===== -->
    <section id="v-faq" class="view">
      <div class="faqpage" id="faqWrap"></div>
    </section>

    <!-- ===== DETAIL ===== -->
    <section id="v-detail" class="view">
      <button class="back" onclick="goBack()"><svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24"><use href="#i-caret"/></svg><span data-t="back"></span></button>
      <div id="detailBody"></div>
    </section>
  </main>
</div>

<!-- check-in sheet -->
<div class="sheet" id="checkinSheet" onclick="if(event.target===this)closeCheckin()"><div class="sheet-card" id="sheetCard"></div></div>
<div class="sheet" id="profileSheet" onclick="if(event.target===this)closeProfile()"><div class="sheet-card" id="profileCard"></div></div>
<div class="sheet" id="submitSheet" onclick="if(event.target===this)closeSubmit()"><div class="sheet-card" id="submitCard"></div></div>
<!-- calendar day sheet -->
<div class="sheet" id="calDaySheet" onclick="if(event.target===this)closeCalDay()"><div class="sheet-card" id="calDayCard"></div></div>
<!-- toast + stamp modal -->
<div class="toast" id="toast"></div>
<div class="modal" id="stampModal" onclick="this.classList.remove('show')">
  <div class="stampcard" onclick="event.stopPropagation()">
    <div class="big" id="msStamp">🍊</div>
    <div class="mtag" id="msMethod"></div>
    <h3 id="msTitle"></h3>
    <p id="msDesc"></p>
    <button class="btn btn-lime" onclick="document.getElementById('stampModal').classList.remove('show')" data-t="ms_ok"></button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js?v=14"></script>
</body>
</html>
